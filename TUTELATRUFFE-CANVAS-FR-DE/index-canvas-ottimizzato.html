<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TutelaTruffe – Orbita Sicura</title>

<!-- ============================
     CSS COMPLETO
=============================== -->
<style>

/* ---------------------------------------------------------
   RESET & BASE
--------------------------------------------------------- */

html, body {
    margin: 0;
    padding: 0;
    background: #000;
    overflow-x: hidden;
    font-family: system-ui, sans-serif;
    color: #fff;
}

/* Variabile per gestire l’altezza della barra superiore */
:root {
    --header-height: 120px;
}

/* ---------------------------------------------------------
   HEADER / BARRA DI STATO
--------------------------------------------------------- */

#main-header {
    width: 100%;
    height: var(--header-height);
    background: #0a0a0a;
    border-bottom: 1px solid #222;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 20px;
    position: fixed;
    top: 0;
    left: 0;
    z-index: 3000;
}

/* ---------------------------------------------------------
   ORBIT CONTAINER (ANIMAZIONE PLANETARIA)
--------------------------------------------------------- */

#orbit-container {
    position: relative;
    width: 100vw;
    height: calc(100vh - var(--header-height));
    margin-top: var(--header-height);
    overflow: hidden;
    background: radial-gradient(circle at 20% 20%, #02101f 0, #000 55%, #000 100%);
}

#orbitCanvas {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 1;
}

/* Stile per il contenitore dei pianeti */
#planets-container {
    position: absolute;
    width: 100%;
    height: 100%;
    top: 0;
    left: 0;
    pointer-events: none; /* I pianeti stessi avranno pointer-events */
    z-index: 100;
}

/* Stile base per i pianeti (oggetti DOM) */
.planet {
    position: absolute;
    width: 100px;  /* Aumentata per visibilità */
    height: 100px; /* Aumentata per visibilità */
    background-color: rgba(0, 150, 255, 0.7);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    color: white;
    font-size: 12px;
    border: 2px solid rgba(255, 255, 255, 0.5);
    box-shadow: 0 0 15px rgba(0, 150, 255, 0.8);
    cursor: pointer;
    pointer-events: auto; /* Abilita eventi click sui pianeti */
    z-index: 101;
    transition: transform 0.2s ease, box-shadow 0.2s ease;
}

.planet:hover {
    transform: scale(1.1);
    box-shadow: 0 0 25px rgba(0, 150, 255, 1);
}

/* ---------------------------------------------------------
   LOGO & BRANDING
--------------------------------------------------------- */

#logo-container {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 200px; /* Adatta alla dimensione del tuo logo */
    height: 200px; /* Adatta alla dimensione del tuo logo */
    z-index: 1000;
    display: flex;
    align-items: center;
    justify-content: center;
}

#logo-container img {
    max-width: 100%;
    height: auto;
    filter: drop-shadow(0 0 15px rgba(255, 215, 0, 0.6)); /* Ombra dorata per risaltare */
}

/* ---------------------------------------------------------
   CONTROLLI E PULSANTI
--------------------------------------------------------- */

.controls-container {
    position: absolute;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 20px;
    z-index: 2000;
}

.control-button {
    padding: 12px 25px;
    background: rgba(20, 20, 20, 0.8);
    border: 1px solid #444;
    color: #eee;
    border-radius: 8px;
    cursor: pointer;
    transition: background 0.3s, color 0.3s;
    font-weight: 500;
}

.control-button:hover {
    background: #ffd700;
    color: #000;
}

/* ---------------------------------------------------------
   ELEMENTI SPECIFICI (ES. PULSANTI PETIZIONE)
--------------------------------------------------------- */

.authorities-search-button,
.read-petition-council,
.read-petition-left,
.global-protection-button,
.read-petition-approved,
.read-petition-right {
    position: absolute;
    padding: 10px 15px;
    border-radius: 8px;
    background-color: #007bff;
    color: white;
    text-align: center;
    text-decoration: none;
    font-weight: bold;
    border: 1px solid #0056b3;
    box-shadow: 0 2px 5px rgba(0,0,0,0.2);
    cursor: pointer;
    z-index: 2500;
}

/* Posizionamento specifico per ogni pulsante */

/* --- COLONNA SINISTRA --- */
.authorities-search-button {
    top: 200px;
    left: 50px;
}

.read-petition-council {
    top: 260px;
    left: 50px;
}

.read-petition-left {
    top: 320px;
    left: 50px;
}

/* --- COLONNA DESTRA --- */
.global-protection-button {
    top: 200px;
    right: 50px;
}

.read-petition-approved {
    top: 260px;
    right: 50px;
}

.read-petition-right {
    top: 320px;
    right: 50px;
}

/* ---------------------------------------------------------
   INFO BOX / POPUP
--------------------------------------------------------- */

#info-box {
    position: absolute;
    top: 20px;
    right: 20px;
    width: 250px;
    background: rgba(15, 15, 15, 0.85);
    border: 1px solid #333;
    border-radius: 8px;
    padding: 15px;
    color: #ccc;
    font-size: 14px;
    z-index: 2000;
    display: none; /* Nascosto di default */
}

#info-box h3 {
    margin: 0 0 10px;
    color: #ffd700;
    font-size: 16px;
}

#info-box p {
    margin: 0;
}

/* ---------------------------------------------------------
   RESPONSIVE DESIGN
--------------------------------------------------------- */

@media (max-width: 768px) {
    :root {
        --header-height: 100px;
    }

    .controls-container {
        flex-direction: column;
        bottom: 20px;
        gap: 15px;
    }

    .authorities-search-button,
    .read-petition-council,
    .read-petition-left,
    .global-protection-button,
    .read-petition-approved,
    .read-petition-right {
        position: static;
        margin: 10px auto;
        width: 80%;
    }

    #orbit-container {
        /* Potresti voler nascondere o semplificare l'orbita su mobile */
    }
}

</style>
</head>
