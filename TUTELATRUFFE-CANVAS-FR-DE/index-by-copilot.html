<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Medusa Attack – Ipnosi Bancaria</title>

    <!-- CSS principale -->
    <link rel="stylesheet" href="./css/medusa-style.css">

    <style>
        /* Layout base della pagina */
        body {
            margin: 0;
            padding: 0;
            background: #000;
            font-family: Arial, sans-serif;
            color: white;
            overflow-x: hidden;
        }

        /* Contenitore centrale */
        #main-scene {
            width: 100%;
            height: 100vh;
            position: relative;
            overflow: hidden;
        }

        /* Medusa */
        #medusa {
            position: absolute;
            top: 10%;
            left: 50%;
            transform: translateX(-50%);
            width: 320px;
            height: auto;
            z-index: 10;
        }

        /* Occhi */
        #eye-left {
            top: 165px;
            left: calc(50% - 48px);
        }

        #eye-right {
            top: 165px;
            left: calc(50% + 10px);
        }

        /* Container rosso */
        #threat-container {
            position: absolute;
            top: 52%;
            left: 50%;
            transform: translateX(-50%);
            width: 420px;
        }

        /* Campo di battaglia */
        #battlefield {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 30;
        }

        /* Regno delle tre Meduse */
        #medusa-realm {
            position: absolute;
            bottom: 22%;
            left: 50%;
            transform: translateX(-50%);
            width: 380px;
            height: 180px;
            text-align: center;
            z-index: 5;
        }

        /* Zona di comfort */
        #comfort-zone {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
        }

        /* Orbita inferiore */
        #lower-orbit {
            position: absolute;
            bottom: 12%;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            text-align: center;
        }

        /* Replay */
        #replay-btn {
            margin-top: 20px;
        }
    </style>
</head>

<body>

<div id="main-scene">

    <!-- Medusa -->
    <img id="medusa" src="./Images/medusa.png" alt="Medusa">

    <!-- Occhi paralizzanti -->
    <div class="medusa-eye" id="eye-left"></div>
    <div class="medusa-eye" id="eye-right"></div>

    <!-- Container rosso -->
    <div id="threat-container">Caricamento…</div>

    <!-- Campo di battaglia -->
    <div id="battlefield"></div>

    <!-- Regno delle tre Meduse -->
    <div id="medusa-realm"></div>

    <!-- Zona di comfort -->
    <div id="comfort-zone"></div>

    <!-- Orbita inferiore -->
    <div id="lower-orbit">
        <button id="replay-btn">↻ Replay Animation</button>
    </div>

</div>

<!-- Motore JS -->
<script src="./js/medusa-engine.js"></script>

</body>
</html>
